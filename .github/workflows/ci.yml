name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: اختبارات ai-builder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: تشغيل الاختبارات
        working-directory: ai-builder
        run: python3 -m unittest discover -s tests -t . -v
